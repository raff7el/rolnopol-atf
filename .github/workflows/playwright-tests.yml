name: Playwright Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - '**'
  push:
    branches:
      - main

permissions:
  contents: read
  checks: write

# Cancel an in-progress run when a newer commit is pushed to the same PR.
# Runs on main are never cancelled, so every merged commit gets a full result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Exposes the "dev" environment's variables (vars.*) and secrets (secrets.*) to this job
    environment: dev
    env:
      BASE_URL: ${{ vars.BASE_URL }}
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      TEST_USER_DISPLAY_NAME: ${{ vars.TEST_USER_DISPLAY_NAME }}
      # "pr<number>" for pull requests, branch name (e.g. "main") for pushes
      ARTIFACT_SUFFIX: ${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || github.ref_name }}-${{ github.run_number }}-${{ github.run_attempt }}
    services:
      rolnopol:
        # Pinned for reproducible runs; bump deliberately when upgrading the app under test
        image: jaktestowac/rolnopol:1.126.0
        ports:
          - 3000:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Fail fast if the app under test is not healthy, instead of letting every test time out.
      # --fail turns HTTP errors into a non-zero exit; --retry-all-errors retries them too.
      - name: Health check rolnopol
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 2 --retry-all-errors --max-time 5 \
            "$BASE_URL/api/v1/healthcheck"
          echo

      - name: Dump rolnopol logs
        if: ${{ failure() }}
        run: docker logs "${{ job.services.rolnopol.id }}"

      - name: Run tests
        id: tests
        run: npx playwright test

      # Reporting steps run only if the tests actually ran and the workflow wasn't cancelled
      - name: Publish test summary
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: dorny/test-reporter@v2
        with:
          name: Playwright results
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload HTML report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ env.ARTIFACT_SUFFIX }}
          path: playwright-report/
          retention-days: 7

      - name: Upload test results (traces, JUnit)
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ env.ARTIFACT_SUFFIX }}
          path: test-results/
          retention-days: 7
