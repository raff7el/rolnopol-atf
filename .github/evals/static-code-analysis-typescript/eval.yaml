name: static-code-analysis-typescript-eval
description: Trigger and behaviour checks for static-code-analysis-typescript.
skill: static-code-analysis-typescript
version: "2.0"
config:
  trials_per_task: 1
  timeout_seconds: 300
  parallel: false
  executor: copilot-sdk
  model: claude-sonnet-4.6
metrics:
  - name: task_completion
    weight: 0.7
    threshold: 0.8
    description: Did the skill trigger when it should, stay out when it should not, and apply its conventions?
  - name: efficiency
    weight: 0.3
    threshold: 0.7
    description: Did the skill stay within behavior limits?
graders:
  - type: behavior
    name: token-budget
    config:
      # Answers often include a config file; 1200 was too tight for that.
      max_tokens: 2000
tasks:
  - "tasks/*.yaml"
