id: positive-trigger-002
name: CI gate in existing pipeline
description: The quality gate goes into the existing workflow as a quality job that the tests depend on.
tags:
  - positive-trigger
inputs:
  prompt: "Add a CI quality gate for formatting, linting and type checking. We already run Playwright tests in .github/workflows/playwright-tests.yml."
expected:
  should_trigger: true
graders:
  - type: text
    name: integrates-quality-job
    config:
      contains:
        - "playwright-tests.yml"
        - "needs: quality"
        - "format:check"
        - "tsc:check"
