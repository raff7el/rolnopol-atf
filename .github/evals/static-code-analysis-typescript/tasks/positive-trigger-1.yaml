id: positive-trigger-001
name: lint-staged order
description: A format:check failure after commits is fixed by running eslint --fix before prettier --write.
tags:
  - positive-trigger
inputs:
  prompt: "Our lint-staged runs prettier --write and then eslint --fix on *.ts. After commits, CI format:check fails on imports like `import { expect,test }`. Fix it."
expected:
  should_trigger: true
graders:
  - type: text
    name: eslint-before-prettier
    config:
      contains:
        - "eslint --fix"
        - "prettier --write"
        - "before"
